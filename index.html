<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LA CONSCIENCE MKP – école secondaire, Commune Annexe, quartier Kashamata. Site de démonstration.">
<meta name="theme-color" content="#2F54EB">
<title>LA CONSCIENCE MKP – École secondaire</title>

<!--
=====================================================================
  PORTAIL SCOLAIRE – LA CONSCIENCE MKP  (version 2 : thème clair bleu/violet)
  Seules les informations fournies sont affichées.
  Tout ce qui manque apparaît comme « Informations à compléter ».

  OÙ MODIFIER ?
  1) Bas du fichier : « ===== CONFIGURATION ===== »
     → WhatsApp, téléphones, e-mail, logo, photos, communiqués,
       et les textes des 9 options (liste OPTIONS).
  2) Couleurs : juste en dessous, dans :root.
  3) Textes à compléter : cherchez « À COMPLÉTER » dans le HTML.
=====================================================================
-->

<!-- Police élégante (facultative). Sans Internet, une police classique de secours s'affiche. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&display=swap" rel="stylesheet">

<!-- Page de bienvenue : affichée seulement à une NOUVELLE ouverture (pas à l'actualisation, ni au retour arrière) -->
<script>
(function(){
  try{
    var n = performance.getEntriesByType("navigation")[0];
    var type = n ? n.type : (performance.navigation.type === 0 ? "navigate" : "other");
    if (type === "navigate") document.documentElement.classList.add("cover-on");
  }catch(e){}
})();
</script>
<noscript><style>.rise,.reveal{opacity:1!important;transform:none!important}</style></noscript>

<style>
/* ---------- COULEURS (provisoires, à remplacer par les couleurs officielles) ---------- */
:root{
  --royal:#2F54EB;        /* bleu royal */
  --royal-2:#1E3FBF;      /* bleu royal foncé */
  --sky:#38BDF8;          /* bleu ciel */
  --sky-2:#BFE6FF;        /* bleu ciel très clair */
  --violet:#7C5CFF;       /* violet */
  --violet-2:#A78BFA;
  --ink:#0F1B4C;          /* titres */
  --text:#1E2A4A;
  --muted:#58637F;
  --white:#FFFFFF;
  --bg-soft:rgba(238,244,255,.72);
  --grad:linear-gradient(135deg,var(--royal) 0%,var(--violet) 100%);
  --grad-sky:linear-gradient(135deg,var(--sky) 0%,var(--royal) 100%);
  --radius:22px;
  --shadow:0 12px 34px rgba(47,84,235,.12);
  --shadow-lg:0 22px 50px rgba(47,84,235,.22);
  --font-title:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
html.cover-on,html.cover-on body{overflow:hidden}
body{font-family:var(--font-body);color:var(--text);background:var(--white);line-height:1.7;font-size:17px;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
.container{width:min(1140px,90%);margin-inline:auto}
section{padding:68px 0}
.alt{background:var(--bg-soft)}
h1,h2,h3{font-family:var(--font-title);line-height:1.25;color:var(--ink)}
button{font-family:inherit}

/* Halos lumineux d'arrière-plan du site (légers, animés) */
.bg-glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--c) 0%,transparent 68%);opacity:.5;will-change:transform}
.b1{--c:#5aa7ff;width:70vmax;height:70vmax;left:-28vmax;top:-26vmax;animation:drift1 24s ease-in-out infinite alternate}
.b2{--c:#8b5cf6;width:62vmax;height:62vmax;right:-26vmax;top:8vmax;animation:drift2 28s ease-in-out infinite alternate}
.b3{--c:#38bdf8;width:58vmax;height:58vmax;left:6vmax;bottom:-30vmax;animation:drift3 30s ease-in-out infinite alternate}
.bg-glow .blob{opacity:.2}
@keyframes drift1{to{transform:translate3d(16vmax,12vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-14vmax,16vmax,0) scale(1.1)}}
@keyframes drift3{to{transform:translate3d(18vmax,-12vmax,0) scale(1.2)}}

/* Barre de progression */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:160;background:var(--grad);transform:scaleX(0);transform-origin:0 50%}

.section-head{text-align:center;max-width:700px;margin:0 auto 40px}
.eyebrow{display:inline-block;color:var(--violet);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;margin-bottom:8px}
.section-head h2{font-size:clamp(1.85rem,6vw,2.6rem)}
.section-head h2::after{content:"";display:block;width:70px;height:4px;background:var(--grad);margin:14px auto 0;border-radius:4px}
.section-head p{color:var(--muted);margin-top:14px}
.sub-title{font-size:1.4rem;margin-bottom:20px}

/* Étiquette « Informations à compléter » */
.todo{display:inline-block;font-size:.8rem;font-weight:600;color:#5b3fd0;background:rgba(124,92,255,.1);border:1.5px dashed var(--violet);padding:3px 12px;border-radius:30px}
.todo-box{border:2px dashed rgba(124,92,255,.5);background:rgba(124,92,255,.05);border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center}
.todo-box b{display:block;color:var(--ink);font-family:var(--font-title);margin-bottom:4px}

/* Boutons (les noms de classes d'origine sont conservés) */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:50px;font-weight:600;font-size:1rem;border:2px solid transparent;cursor:pointer;transition:transform .3s,box-shadow .3s,background .3s,color .3s;-webkit-tap-highlight-color:transparent}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn-gold{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(47,84,235,.35)}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(124,92,255,.45)}
.btn-outline{border-color:var(--royal);color:var(--royal);background:rgba(255,255,255,.6)}
.btn-outline:hover{background:var(--royal);color:#fff;transform:translateY(-3px)}
.btn-navy{background:var(--royal);color:#fff;box-shadow:0 8px 20px rgba(47,84,235,.3)}
.btn-navy:hover{background:var(--royal-2);transform:translateY(-3px)}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.btn-wa:hover{background:#1ebe5a;transform:translateY(-3px)}
.btn-glow{animation:glowpulse 3s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 0 0 8px rgba(124,92,255,.14),0 14px 34px rgba(47,84,235,.5)}}


/* ---------- NAVIGATION ---------- */
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(47,84,235,.12);box-shadow:0 4px 20px rgba(47,84,235,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--font-title);font-weight:800;font-size:1.02rem;letter-spacing:.02em}
.logo{width:44px;height:44px;border-radius:50%;background:var(--white) center/contain no-repeat;border:2px dashed var(--violet);color:var(--royal);display:grid;place-items:center;font-weight:800;font-size:.6rem;text-align:center;line-height:1.05;flex-shrink:0}
.logo.has-img{border:2px solid var(--royal)}
.menu{display:flex;gap:2px}
.menu a{color:var(--text);padding:8px 9px;border-radius:30px;font-size:.88rem;font-weight:500;transition:.25s;white-space:nowrap}
.menu a:hover{background:rgba(47,84,235,.08);color:var(--royal)}
.menu a.active{background:var(--grad);color:#fff}
.burger{display:none;background:none;border:0;cursor:pointer;width:46px;height:46px;position:relative}
.burger span{position:absolute;left:11px;right:11px;height:3px;background:var(--royal);border-radius:3px;transition:.3s}
.burger span:nth-child(1){top:15px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:29px}
.burger.open span:nth-child(1){top:22px;transform:rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){top:22px;transform:rotate(-45deg)}
@media(max-width:1100px){
  .burger{display:block}
  .menu{position:fixed;top:68px;left:0;right:0;flex-direction:column;background:rgba(255,255,255,.97);padding:14px 5% 24px;gap:4px;transform:translateY(-130%);opacity:0;transition:transform .4s ease,opacity .3s;max-height:calc(100vh - 68px);overflow:auto;box-shadow:0 18px 30px rgba(47,84,235,.15);border-bottom:3px solid var(--violet)}
  .menu.open{transform:translateY(0);opacity:1}
  .menu a{padding:15px 18px;font-size:1.08rem;border-radius:14px}
}

/* ---------- PHOTOS / EMPLACEMENTS ---------- */
.photo{background-size:cover;background-position:center;background-repeat:no-repeat;position:relative;display:grid;place-items:center;overflow:hidden}
.photo.has-img .ph-icon,.photo.has-img .ph-txt{display:none}
.ph-icon{font-size:2.4rem}
.ph-txt{font-size:.82rem;opacity:.95;text-align:center;padding:0 10px}
.ph-1{background-image:linear-gradient(135deg,#2F54EB,#7C5CFF)}
.ph-2{background-image:linear-gradient(135deg,#38BDF8,#2F54EB)}

/* ---------- APPARITIONS ---------- */
.rise{opacity:0;transform:translateY(26px)}
html.site-ready .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0) * .13s + .15s)}
@keyframes rise{to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.reveal.visible{opacity:1;transform:none}

/* ---------- PAGE DE BIENVENUE ---------- */
#cover{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));overflow:hidden;background:linear-gradient(165deg,#f6f9ff 0%,#e9f1ff 45%,#f0eaff 100%);transition:opacity .85s ease,transform .85s ease}
html.cover-on #cover{display:flex}
#cover.leaving{opacity:0;transform:scale(1.06);pointer-events:none}
#cover .aurora{position:absolute;inset:0;overflow:hidden}
#cover .blob{opacity:.6}
#cover .b1{--c:#4f9bff}
#cover .b2{--c:#9a6bff}
#cover .b3{--c:#3ec6ff}
.cover-inner{position:relative;z-index:2;width:min(560px,100%);max-height:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;animation:coverIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes coverIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.cover-logo{width:104px;height:104px;border-radius:50%;background:#fff center/contain no-repeat;border:2px dashed var(--violet);display:grid;place-items:center;color:var(--royal);font-weight:800;font-size:.72rem;line-height:1.2;box-shadow:0 14px 34px rgba(124,92,255,.3);margin-bottom:20px;animation:floaty 6s ease-in-out infinite}
.cover-logo.has-img{border:3px solid #fff}
@keyframes floaty{50%{transform:translateY(-9px)}}
.cover-kicker{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--violet);font-weight:700;margin-bottom:8px}
.cover-name{font-family:var(--font-title);font-weight:800;font-size:clamp(2.3rem,11vw,3.9rem);line-height:1.08;letter-spacing:.05em;color:var(--ink)}
.cover-name span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:block}
.cover-orn{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--violet)}
.cover-orn i{display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--violet))}
.cover-orn i:last-child{background:linear-gradient(90deg,var(--violet),transparent)}
.cover-title{font-weight:700;letter-spacing:.14em;font-size:clamp(.85rem,3.6vw,1.05rem);color:var(--royal-2);line-height:1.5}
.cover-slogan{font-family:var(--font-title);font-style:italic;font-size:clamp(1.15rem,5vw,1.5rem);color:var(--ink);margin:12px 0 10px}
.cover-intro{color:var(--muted);font-size:clamp(.95rem,3.9vw,1.05rem);max-width:440px;margin-bottom:28px}
#coverBtn{padding:16px 30px;font-size:clamp(.88rem,3.7vw,1rem);letter-spacing:.06em}
@media(max-height:640px){.cover-logo{width:76px;height:76px;margin-bottom:10px}.cover-intro{margin-bottom:16px}.cover-orn{margin:8px 0}}

/* ---------- ACCUEIL ---------- */
#accueil{padding:0;min-height:calc(100vh - 104px);min-height:calc(100svh - 104px);display:flex;align-items:center;position:relative;isolation:isolate;overflow:hidden;text-align:center}
#accueil .hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;background:linear-gradient(170deg,#f7faff 0%,#e8f1ff 50%,#efe9ff 100%)}
#accueil .hero-bg.has-img{background-size:cover;background-position:center}
#accueil::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.85))}
#accueil .aurora{position:absolute;inset:0;z-index:-1;overflow:hidden}
#accueil .blob{opacity:.5}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(124,92,255,.3);z-index:-1;animation:floaty 9s ease-in-out infinite}
.ring.r1{width:340px;height:340px;right:-120px;top:-90px}
.ring.r2{width:200px;height:200px;left:-70px;bottom:40px;border-color:rgba(56,189,248,.45);animation-delay:-4s}
.hero{padding:70px 0 90px;max-width:800px;margin-inline:auto}
.hero .tag{display:inline-block;border:1px solid rgba(124,92,255,.5);background:rgba(255,255,255,.7);color:var(--violet);padding:6px 18px;border-radius:30px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:22px}
.hero h1{font-size:clamp(2.4rem,10.5vw,4.4rem);margin-bottom:14px;letter-spacing:.03em;line-height:1.1}
.hero h1 span{display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero .place{color:var(--royal-2);font-family:var(--font-title);font-weight:700;font-size:clamp(1.05rem,4vw,1.35rem);margin-bottom:10px}
.hero .slogan{font-family:var(--font-title);font-style:italic;color:var(--ink);font-size:clamp(1.1rem,4.4vw,1.4rem);margin-bottom:14px}
.hero p.lead{color:var(--muted);margin:0 auto 32px;max-width:560px}
.hero .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.hero .actions .btn{min-width:230px}
@media(max-width:600px){.hero{padding:36px 0 84px}.hero .tag{margin-bottom:16px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-52px;position:relative;z-index:2}
.stat{background:var(--white);border-radius:var(--radius);padding:24px 10px;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(47,84,235,.1);border-top:4px solid var(--royal);animation:floaty 7s ease-in-out infinite}
.stat:nth-child(2){border-top-color:var(--sky);animation-delay:-2s}
.stat:nth-child(3){border-top-color:var(--violet);animation-delay:-4s}
.stat b{display:block;font-family:var(--font-title);font-size:2rem;color:var(--ink)}
.stat small{color:var(--muted)}
@media(max-width:560px){.stats{margin-top:-40px;gap:8px}.stat{padding:18px 6px}.stat b{font-size:1.4rem}.stat small{font-size:.78rem}}

/* ---------- PRÉSENTATION ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.about-grid .photo{min-height:340px;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:5px solid var(--white);color:#fff;text-align:center}
.facts{display:grid;gap:12px}
.fact{display:flex;gap:14px;align-items:center;background:var(--white);padding:16px 20px;border-radius:18px;box-shadow:var(--shadow);border-left:5px solid var(--royal);transition:.3s}
.fact:nth-child(2){border-left-color:var(--sky)}
.fact:nth-child(3){border-left-color:var(--violet)}
.fact:nth-child(4){border-left-color:var(--violet-2)}
.fact:hover{transform:translateX(6px)}
.fact .ico{font-size:1.6rem}
.fact small{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}
.fact b{color:var(--ink)}
.cards-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:40px}
.card{position:relative;background:var(--white);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:transform .35s,box-shadow .35s;border:1px solid rgba(47,84,235,.1);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad)}
.card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg)}
.card .ico{font-size:2rem;margin-bottom:8px}
.card h3{font-size:1.2rem;margin-bottom:10px}
@media(max-width:860px){.about-grid{grid-template-columns:1fr}}

/* ---------- HISTOIRE, MISSION, VALEURS, MESSAGE ---------- */
.pres{display:grid;gap:22px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card p.ptxt{color:var(--muted);white-space:pre-line}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.val-card{border-radius:20px;padding:22px 20px;color:#fff;background:var(--grad);box-shadow:0 10px 24px rgba(47,84,235,.25);transition:transform .35s}
.val-card:nth-child(even){background:var(--grad-sky)}
.val-card:hover{transform:translateY(-6px) scale(1.02)}
.val-card b{display:block;font-family:var(--font-title);font-size:1.2rem;margin-bottom:6px}
.val-card span{font-size:.93rem;color:rgba(255,255,255,.92);line-height:1.5;display:block}
.pmsg{position:relative;background:var(--white);border-radius:var(--radius);padding:30px 26px 26px;box-shadow:var(--shadow);border:1px solid rgba(47,84,235,.1);border-left:6px solid var(--violet)}
.pmsg::before{content:"\201C";position:absolute;right:20px;top:-6px;font-family:var(--font-title);font-size:5.5rem;line-height:1;color:rgba(124,92,255,.18)}
.pmsg h3{font-size:1.3rem;margin-bottom:12px}
.pmsg p{color:var(--muted);white-space:pre-line;font-style:italic}
.pmsg .psign{margin-top:16px;font-style:normal;font-weight:700;font-family:var(--font-title);color:var(--royal-2)}
@media(max-width:760px){.pgrid{grid-template-columns:1fr}}

/* ---------- CLASSES ET OPTIONS ---------- */
.classes{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:50px}
.classe{background:var(--grad);color:#fff;border-radius:20px;padding:22px 8px;text-align:center;transition:.35s;box-shadow:0 10px 24px rgba(47,84,235,.25)}
.classe:nth-child(even){background:var(--grad-sky)}
.classe:hover{transform:translateY(-6px) scale(1.03)}
.classe b{display:block;font-family:var(--font-title);font-size:1.9rem;line-height:1;color:#fff}
.classe span{font-size:.85rem;color:rgba(255,255,255,.88)}
@media(max-width:760px){.classes{grid-template-columns:repeat(3,1fr)}}
.prov-note{max-width:640px;margin:0 auto 28px;text-align:center;font-size:.92rem;color:#5b3fd0;background:rgba(124,92,255,.08);border:1.5px dashed rgba(124,92,255,.5);border-radius:16px;padding:12px 16px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;align-items:start}
.option{background:var(--white);border-radius:var(--radius);padding:26px 22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .35s,box-shadow .35s;border:1px solid rgba(47,84,235,.1)}
.option::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--sky),var(--royal),var(--violet))}
.option:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.option .num{position:absolute;right:16px;top:8px;font-family:var(--font-title);font-size:3.2rem;font-weight:800;color:rgba(47,84,235,.08)}
.option .ico{width:58px;height:58px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-size:1.8rem;margin-bottom:14px;box-shadow:0 8px 18px rgba(47,84,235,.3);transition:.35s}
.option:hover .ico{transform:rotate(-7deg)
